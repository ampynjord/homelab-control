# CI C2C : tests + build Windows a chaque push et pull request ; sur un tag vX.Y.Z, publie une release (c2c.exe + SHA-256).
# Aucun secret : seul le GITHUB_TOKEN du depot, avec des droits minimaux. Actions epinglees par SHA de commit.
name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Chaine Rust stable
        shell: pwsh
        run: rustup toolchain install stable --profile minimal
      - name: Syntaxe des scripts PowerShell
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem scripts -Filter *.ps1) {
            $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$e)
            if ($e.Count) { $bad++; Write-Error "$($f.Name) : $($e[0].Message)" }
          }
          if ($bad) { exit 1 }
      - name: Tests
        shell: pwsh
        run: cargo test --workspace --locked
      - name: Build release
        shell: pwsh
        env:
          C2C_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: cargo build --release --locked -p c2c-cli
      - name: Empreinte SHA-256
        shell: pwsh
        run: |
          Copy-Item target\release\c2c.exe c2c.exe
          $h = (Get-FileHash c2c.exe -Algorithm SHA256).Hash.ToLower()
          "$h  c2c.exe" | Out-File -Encoding ascii c2c.exe.sha256
          "SHA-256 : $h"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: c2c-windows
          path: |
            c2c.exe
            c2c.exe.sha256
          if-no-files-found: error
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Chaine Rust stable
        shell: pwsh
        run: rustup toolchain install stable --profile minimal
      - name: Dependances de l'interface (versions verrouillees)
        shell: pwsh
        working-directory: app
        run: npm ci
      - name: Build de l'application bureau
        shell: pwsh
        working-directory: app
        env:
          C2C_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: npx tauri build --no-bundle
      - name: Empreinte SHA-256
        shell: pwsh
        run: |
          Copy-Item app/src-tauri/target/release/c2c-desktop.exe c2c-desktop.exe
          $h = (Get-FileHash c2c-desktop.exe -Algorithm SHA256).Hash.ToLower()
          "$h  c2c-desktop.exe" | Out-File -Encoding ascii c2c-desktop.exe.sha256
          "SHA-256 : $h"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: c2c-desktop
          path: |
            c2c-desktop.exe
            c2c-desktop.exe.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-test, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: c2c-windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: c2c-desktop
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" c2c.exe c2c.exe.sha256 c2c-desktop.exe c2c-desktop.exe.sha256 --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "Build CI de $GITHUB_SHA. Verifier l'empreinte SHA-256 avant installation."
