[package]
name = "c2c-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "c2c"
path = "src/main.rs"

[dependencies]
c2c-core = { path = "../c2c-core" }
c2c-api = { path = "../c2c-api" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
c2c-windows = { path = "../c2c-windows" }
