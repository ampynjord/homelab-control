[package]
name = "c2c-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
getrandom = "0.2"
thiserror = "1"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3"
